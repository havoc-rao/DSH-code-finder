# dsh-code-finder bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# installed through the official CLI —
#
#   dsh plugin --profile <name> add @havocrao/dsh-code-finder
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `@havocrao/dsh-code-finder` to the
# bundle stack. The profile boot then merges THIS patch (a single `insert` of
# the plugin row) exactly like the manual cordis.patch.yml mount line used
# before. No profile file edits needed — one command installs and mounts.
#
# The row is two-faced in one entry: the node face (this entry's package root)
# registers the /code-finder/api/search route (host half); the browser face
# comes from the same entry's `dsh.client` declaration — the host scans it and
# serves the /plugins/@havocrao/dsh-code-finder/client.js wire bundle, which
# the cordis kernel imports as { name, inject, apply } (client half, the
# Opt+Shift hover overlay).
#
# Roots: the host half's layer-4 name search falls back to the core defaults
# (~/.dsh/source/current + <host cwd>/src) when the profile carries NO roots
# override at all — the override is a FULL REPLACEMENT, never a merge, so a
# configured list must spell out every root you want searched. Manage per
# profile with dcf's own CLI (idempotent, seeds the two defaults on first
# add):
#
#   dcf roots add web /abs/path/to/plugin/UI/src
#   dcf roots list web
#   dcf roots remove web /abs/path/to/plugin/UI/src
#
#   dcf ensure /abs/path/to/plugin --profile web          # 一站式：接线 + roots + build:dev + 宿主验证
#   dcf status --cwd /abs/path/to/plugin --profile web    # 重启宿主后的端到端复检（见上文注）
#
# or write the id-targeted patch entry directly in that profile's
# cordis.patch.yml (the profile patch layer is a list of Loader patch
# entries keyed by row id — `- overrides:` wrapping is NOT recognized by
# the Loader and is skipped with a boot warning):
#
#   - id: dsh-code-finder
#     config:
#       roots:
#         - /Users/<you>/.dsh/source/current   # default #1; write it home-expanded (`~` is not expanded)
#         - !!js "process.cwd() + '/src'"      # default #2; dynamic, follows the host's cwd
#         - /absolute/path/to/plugin/UI/src
#
# Precision note: data-locatorjs build-time injection (bundler plugins
# `@havocrao/dsh-code-finder/tsdown` / `/vite`) still needs one line in the
# UI project's build config — a CLI cannot edit another project's bundler —
# but roots-override gives path-level resolution with zero build changes.
#
# Strict dev semantics first: same predicate as build-time codeFinderEnabled.
# Only an explicit dev env mounts — `NODE_ENV === 'development'`. Unset NODE_ENV
# (undefined) is NOT dev: this row is disabled, and because the dcf-generated
# mount row (`dsh-code-finder-mount`) shares the predicate, NO entry mounts —
# no overlay, no /code-finder/api route. A "build with no injection + runtime
# overlay shell" combination is impossible (production payload needs an explicit
# `enabled` on the build side, which is a separate concern from this runtime row).
#
# Double-mount guard: a profile that already mounts this package under its own
# manual row (or an aggregate bundle) would register /code-finder/api twice
# and fail the plugin tree at boot ("duplicate prefix route"). The `!!js`
# disabled expression ALSO backs THIS row off when another *enabled* entry
# already mounts `@havocrao/dsh-code-finder`; the manual/aggregate instance
# then owns the locator. Surfaced before this row in entry-list order only, so
# the manual row must precede the bundle row when both exist.
- insert:
    - id: dsh-code-finder
      name: '@havocrao/dsh-code-finder'
      disabled: !!js "process.env.NODE_ENV !== 'development' || [...ctx.loader.entries()].some((e) => e.options.name === '@havocrao/dsh-code-finder' && e.options.id !== 'dsh-code-finder' && !e.disabled)"